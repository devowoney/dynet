[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynet"
version = "0.1.0"
description = "ML-based dynamical system emulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3.2",
  "lightning>=2.3.0",
  "numpy>=1.24.0",
  "torch>=2.2.0",
  "xarray>=2024.1.0",
  "netCDF4>=1.6.5",
  "zarr>=2.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]
